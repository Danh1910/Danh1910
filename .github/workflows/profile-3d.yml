name: Generate 3D Contribution Calendar

on:
  # Chạy lại mỗi ngày lúc 01:10 giờ VN (18:10 UTC hôm trước)
  schedule:
    - cron: "10 18 * * *"
  # Cho phép bấm chạy tay ở tab Actions
  workflow_dispatch:
  # Chạy luôn khi push. Commit do GITHUB_TOKEN tạo ra không kích hoạt
  # workflow mới, nên không có vòng lặp; paths-ignore là lớp chặn thứ hai.
  push:
    branches:
      - main
    paths-ignore:
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # SVG sinh ra nằm ở profile-3d-contrib/ và được commit thẳng vào main
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: regenerate 3D contribution calendar"; then
            git push
          fi
