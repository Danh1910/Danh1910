name: Generate Snake Animation

on:
  # Chạy lại mỗi ngày lúc 01:00 giờ VN (18:00 UTC hôm trước)
  schedule:
    - cron: "0 18 * * *"
  # Cho phép bấm chạy tay ở tab Actions
  workflow_dispatch:
  # Chạy luôn mỗi khi README được cập nhật
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake from contribution grid
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      # SVG được đẩy sang nhánh "output" để không làm bẩn nhánh main
      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
