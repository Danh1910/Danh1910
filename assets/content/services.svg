<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 544" width="1200" height="544" role="img" aria-label="What I can build: e-commerce back offices, integrations &amp; scheduled jobs, automation &amp; browser extensions, customer portals live on the web.">
  <defs>
    <style>
      .m { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
      .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
      .blink { animation: blink 1.1s steps(1, end) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#A855F7" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 1L9 5L0 9z" fill="#6E7681"/>
    </marker>
  </defs>
<rect x="1" y="1" width="588" height="260" rx="18" fill="url(#cardFill)" stroke="#30363D"/>
<rect x="31" y="0.3" width="528" height="1.5" fill="url(#edge)"/>
<rect x="31" y="31" width="46" height="46" rx="12" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.55"/><text class="m" x="54" y="60" font-size="17" fill="#A855F7" font-weight="700" text-anchor="middle">01</text>
<text class="m" x="95" y="62" font-size="22" fill="#F0F6FC" font-weight="700">E-commerce back offices</text>
<text class="s" x="31" y="115" font-size="19" fill="#9DA7B3">Orders, customers, designs and product customization in</text>
<text class="s" x="31" y="145" font-size="19" fill="#9DA7B3">one place — with<tspan fill="#F0F6FC" font-weight="600"> roles for each team</tspan>, dashboards and</text>
<text class="s" x="31" y="175" font-size="19" fill="#9DA7B3">reports.</text>
<rect x="31" y="203" width="78.4" height="28" rx="14" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.5"/><text class="m" x="70.2" y="221.9" font-size="14" fill="#A855F7" text-anchor="middle">orders</text>
<rect x="117.4" y="203" width="70" height="28" rx="14" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.5"/><text class="m" x="152.4" y="221.9" font-size="14" fill="#A855F7" text-anchor="middle">roles</text>
<rect x="195.4" y="203" width="86.8" height="28" rx="14" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.5"/><text class="m" x="238.8" y="221.9" font-size="14" fill="#A855F7" text-anchor="middle">reports</text>
<rect x="611" y="1" width="588" height="260" rx="18" fill="url(#cardFill)" stroke="#30363D"/>
<rect x="641" y="0.3" width="528" height="1.5" fill="url(#edge)"/>
<rect x="641" y="31" width="46" height="46" rx="12" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.55"/><text class="m" x="664" y="60" font-size="17" fill="#22D3EE" font-weight="700" text-anchor="middle">02</text>
<text class="m" x="705" y="62" font-size="22" fill="#F0F6FC" font-weight="700">Integrations &amp; scheduled jobs</text>
<text class="s" x="641" y="115" font-size="19" fill="#9DA7B3">Marketplaces, suppliers and internal tools connected</text>
<text class="s" x="641" y="145" font-size="19" fill="#9DA7B3">through<tspan fill="#F0F6FC" font-weight="600"> APIs and webhooks</tspan>, plus CRON jobs and alerts</text>
<text class="s" x="641" y="175" font-size="19" fill="#9DA7B3">that run on their own.</text>
<rect x="641" y="203" width="53.2" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/><text class="m" x="667.6" y="221.9" font-size="14" fill="#22D3EE" text-anchor="middle">api</text>
<rect x="702.2" y="203" width="95.2" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/><text class="m" x="749.8" y="221.9" font-size="14" fill="#22D3EE" text-anchor="middle">webhooks</text>
<rect x="805.4" y="203" width="61.6" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/><text class="m" x="836.2" y="221.9" font-size="14" fill="#22D3EE" text-anchor="middle">cron</text>
<rect x="1" y="283" width="588" height="260" rx="18" fill="url(#cardFill)" stroke="#30363D"/>
<rect x="31" y="282.3" width="528" height="1.5" fill="url(#edge)"/>
<rect x="31" y="313" width="46" height="46" rx="12" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.55"/><text class="m" x="54" y="342" font-size="17" fill="#22D3EE" font-weight="700" text-anchor="middle">03</text>
<text class="m" x="95" y="344" font-size="22" fill="#F0F6FC" font-weight="700">Automation &amp; browser extensions</text>
<text class="s" x="31" y="397" font-size="19" fill="#9DA7B3">Extensions inside seller dashboards and background</text>
<text class="s" x="31" y="427" font-size="19" fill="#9DA7B3">pipelines that turn<tspan fill="#F0F6FC" font-weight="600"> hours of repetitive work into one</tspan></text>
<text class="s" x="31" y="457" font-size="19" fill="#9DA7B3"><tspan fill="#F0F6FC" font-weight="600">click</tspan>.</text>
<rect x="31" y="485" width="112" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/><text class="m" x="87" y="503.9" font-size="14" fill="#22D3EE" text-anchor="middle">chrome-mv3</text>
<rect x="151" y="485" width="103.6" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/><text class="m" x="202.8" y="503.9" font-size="14" fill="#22D3EE" text-anchor="middle">pipelines</text>
<rect x="262.6" y="485" width="78.4" height="28" rx="14" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.5"/><text class="m" x="301.8" y="503.9" font-size="14" fill="#22D3EE" text-anchor="middle">queues</text>
<rect x="611" y="283" width="588" height="260" rx="18" fill="url(#cardFill)" stroke="#30363D"/>
<rect x="641" y="282.3" width="528" height="1.5" fill="url(#edge)"/>
<rect x="641" y="313" width="46" height="46" rx="12" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.55"/><text class="m" x="664" y="342" font-size="17" fill="#A855F7" font-weight="700" text-anchor="middle">04</text>
<text class="m" x="705" y="344" font-size="22" fill="#F0F6FC" font-weight="700">Customer portals, live on the web</text>
<text class="s" x="641" y="397" font-size="19" fill="#9DA7B3">Sign-up,<tspan fill="#F0F6FC" font-weight="600"> PDF invoices by email</tspan>, payment tracking —</text>
<text class="s" x="641" y="427" font-size="19" fill="#9DA7B3">taken all the way to production: hosting, domain, email,</text>
<text class="s" x="641" y="457" font-size="19" fill="#9DA7B3">safe deploys.</text>
<rect x="641" y="485" width="61.6" height="28" rx="14" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.5"/><text class="m" x="671.8" y="503.9" font-size="14" fill="#A855F7" text-anchor="middle">auth</text>
<rect x="710.6" y="485" width="86.8" height="28" rx="14" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.5"/><text class="m" x="754" y="503.9" font-size="14" fill="#A855F7" text-anchor="middle">billing</text>
<rect x="805.4" y="485" width="78.4" height="28" rx="14" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.5"/><text class="m" x="844.6" y="503.9" font-size="14" fill="#A855F7" text-anchor="middle">deploy</text>
</svg>
