<text class="m" x="95" y="62" font-size="22" fill="#F0F6FC" font-weight="700">POD Back Office</text>
<rect x="31" y="103" width="8" height="8" rx="2" fill="#A855F7"/>
<text class="s" x="51" y="115" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Orders &amp; fulfillment</tspan></text>
<text class="s" x="51" y="143" font-size="17" fill="#9DA7B3">Per-marketplace order screens, imports, supplier exports and a</text>
<text class="s" x="51" y="170" font-size="17" fill="#9DA7B3">tracking audit.</text>
<rect x="31" y="201" width="8" height="8" rx="2" fill="#A855F7"/>
<text class="s" x="51" y="213" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Design team workflow</tspan></text>
<text class="s" x="51" y="241" font-size="17" fill="#9DA7B3">Rule-based designer assignment, design rules per SKU, KPI</text>
<text class="s" x="51" y="268" font-size="17" fill="#9DA7B3">dashboards.</text>
<rect x="31" y="299" width="8" height="8" rx="2" fill="#A855F7"/>
<text class="s" x="51" y="311" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Product customization</tspan></text>
<text class="s" x="51" y="339" font-size="17" fill="#9DA7B3">Decodes storefront personalization data so production gets the</text>
<text class="s" x="51" y="366" font-size="17" fill="#9DA7B3">exact text &amp; images.</text>
<rect x="31" y="397" width="8" height="8" rx="2" fill="#A855F7"/>
<text class="s" x="51" y="409" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Earnings &amp; reporting</tspan></text>
<text class="s" x="51" y="437" font-size="17" fill="#9DA7B3">Fees from fulfillment webhooks, plus order and advertising</text>
<text class="s" x="51" y="464" font-size="17" fill="#9DA7B3">dashboards.</text>
<rect x="31" y="500" width="67.2" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="47" cy="516" r="5" fill="#8892BF"/><text class="m" x="59" y="520.9" font-size="14" fill="#C9D1D9">PHP</text>
