<rect x="198.2" y="500" width="92.4" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="214.2" cy="516" r="5" fill="#4FA3E0"/><text class="m" x="226.2" y="520.9" font-size="14" fill="#C9D1D9">jQuery</text>
<rect x="298.6" y="500" width="84" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="314.6" cy="516" r="5" fill="#2FBF71"/><text class="m" x="326.6" y="520.9" font-size="14" fill="#C9D1D9">Nginx</text>
