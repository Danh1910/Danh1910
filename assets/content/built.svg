<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1241" width="1200" height="1241" role="img" aria-label="What I've built: POD back office, APIs/webhooks/CRON, automation &amp; tooling, and how I work. Most work lives in private company repositories.">
