<rect x="641" y="31" width="46" height="46" rx="12" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.55"/><text class="m" x="664" y="60" font-size="17" fill="#22D3EE" font-weight="700" text-anchor="middle">02</text>
<text class="m" x="705" y="62" font-size="22" fill="#F0F6FC" font-weight="700">APIs, Webhooks &amp; CRON</text>
<rect x="641" y="103" width="8" height="8" rx="2" fill="#22D3EE"/>
<text class="s" x="661" y="115" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Marketplace &amp; supplier integrations</tspan></text>
<text class="s" x="661" y="143" font-size="17" fill="#9DA7B3">Storefront APIs, fulfillment webhooks for status, tracking &amp;</text>
<text class="s" x="661" y="170" font-size="17" fill="#9DA7B3">fees.</text>
<rect x="641" y="201" width="8" height="8" rx="2" fill="#22D3EE"/>
<text class="s" x="661" y="213" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Database-driven CRON scheduler</tspan></text>
<text class="s" x="661" y="241" font-size="17" fill="#9DA7B3">Jobs defined in the DB, each in its own process: SLA, ship-by</text>
<text class="s" x="661" y="268" font-size="17" fill="#9DA7B3">&amp; tracking alerts.</text>
<rect x="641" y="299" width="8" height="8" rx="2" fill="#22D3EE"/>
<text class="s" x="661" y="311" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Message &amp; email pipelines</tspan></text>
<text class="s" x="661" y="339" font-size="17" fill="#9DA7B3">Buyer messages and email threads pulled into one internal</text>
<text class="s" x="661" y="366" font-size="17" fill="#9DA7B3">inbox.</text>
<rect x="641" y="397" width="8" height="8" rx="2" fill="#22D3EE"/>
<text class="s" x="661" y="409" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Internal APIs</tspan></text>
<text class="s" x="661" y="437" font-size="17" fill="#9DA7B3">Endpoints that extensions and tools call to sync orders,</text>
<text class="s" x="661" y="464" font-size="17" fill="#9DA7B3">tracking &amp; reports.</text>
<rect x="641" y="500" width="109.2" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="657" cy="516" r="5" fill="#6DB33F"/><text class="m" x="669" y="520.9" font-size="14" fill="#C9D1D9">REST API</text>
<rect x="758.2" y="500" width="109.2" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="774.2" cy="516" r="5" fill="#F0F6FC"/><text class="m" x="786.2" y="520.9" font-size="14" fill="#C9D1D9">Webhooks</text>
<rect x="875.4" y="500" width="75.6" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="891.4" cy="516" r="5" fill="#22D3EE"/><text class="m" x="903.4" y="520.9" font-size="14" fill="#C9D1D9">CRON</text>
<rect x="959" y="500" width="168" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="975" cy="516" r="5" fill="#7AB55C"/><text class="m" x="987" y="520.9" font-size="14" fill="#C9D1D9">Shopify GraphQL</text>
<rect x="1" y="584" width="588" height="530" rx="18" fill="url(#cardFill)" stroke="#30363D"/>
<rect x="31" y="583.3" width="528" height="1.5" fill="url(#edge)"/>
<rect x="31" y="614" width="46" height="46" rx="12" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.55"/><text class="m" x="54" y="643" font-size="17" fill="#22D3EE" font-weight="700" text-anchor="middle">03</text>
<text class="m" x="95" y="645" font-size="22" fill="#F0F6FC" font-weight="700">Automation &amp; Tooling</text>
<rect x="31" y="686" width="8" height="8" rx="2" fill="#22D3EE"/>
<text class="s" x="51" y="698" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Seller-dashboard extension (MV3)</tspan></text>
<text class="s" x="51" y="726" font-size="17" fill="#9DA7B3">Syncs orders, fills tracking, pulls reports and runs queued jobs</text>
<text class="s" x="51" y="753" font-size="17" fill="#9DA7B3">— only while the browser is idle.</text>
<rect x="31" y="784" width="8" height="8" rx="2" fill="#22D3EE"/>
<text class="s" x="51" y="796" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Design rendering pipeline</tspan></text>
<text class="s" x="51" y="824" font-size="17" fill="#9DA7B3">Flask + Redis/RQ driving Photoshop &amp; Illustrator: text swaps,</text>
<text class="s" x="51" y="851" font-size="17" fill="#9DA7B3">face-aware crops, background removal, AI upscaling → Google</text>
<text class="s" x="51" y="878" font-size="17" fill="#9DA7B3">Drive.</text>
<rect x="31" y="909" width="8" height="8" rx="2" fill="#22D3EE"/>
<text class="s" x="51" y="921" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Bulk data-entry tooling</tspan></text>
<text class="s" x="51" y="949" font-size="17" fill="#9DA7B3">Python tools that turn an afternoon of product setup into a</text>
<text class="s" x="51" y="976" font-size="17" fill="#9DA7B3">single run.</text>
<rect x="31" y="1012" width="92.4" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="47" cy="1028" r="5" fill="#FFD43B"/><text class="m" x="59" y="1032.9" font-size="14" fill="#C9D1D9">Python</text>
<rect x="131.4" y="1012" width="84" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="147.4" cy="1028" r="5" fill="#F0F6FC"/><text class="m" x="159.4" y="1032.9" font-size="14" fill="#C9D1D9">Flask</text>
<rect x="223.4" y="1012" width="126" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="239.4" cy="1028" r="5" fill="#FF4438"/><text class="m" x="251.4" y="1032.9" font-size="14" fill="#C9D1D9">Redis / RQ</text>
<rect x="357.4" y="1012" width="126" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="373.4" cy="1028" r="5" fill="#F7DF1E"/><text class="m" x="385.4" y="1032.9" font-size="14" fill="#C9D1D9">JavaScript</text>
<rect x="31" y="1052" width="126" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="47" cy="1068" r="5" fill="#4285F4"/><text class="m" x="59" y="1072.9" font-size="14" fill="#C9D1D9">Chrome MV3</text>
<rect x="165" y="1052" width="201.6" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="181" cy="1068" r="5" fill="#31A8FF"/><text class="m" x="193" y="1072.9" font-size="14" fill="#C9D1D9">Photoshop scripting</text>
<rect x="611" y="584" width="588" height="530" rx="18" fill="url(#cardFill)" stroke="#30363D"/>
<rect x="641" y="583.3" width="528" height="1.5" fill="url(#edge)"/>
<rect x="641" y="614" width="46" height="46" rx="12" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.55"/><text class="m" x="664" y="643" font-size="17" fill="#A855F7" font-weight="700" text-anchor="middle">04</text>
<text class="m" x="705" y="645" font-size="22" fill="#F0F6FC" font-weight="700">How I Work</text>
<rect x="641" y="686" width="8" height="8" rx="2" fill="#A855F7"/>
<text class="s" x="661" y="698" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Start from the bottleneck</tspan></text>
<text class="s" x="661" y="726" font-size="17" fill="#9DA7B3">The step someone repeats every day beats the feature nobody</text>
<text class="s" x="661" y="753" font-size="17" fill="#9DA7B3">asked for.</text>
<rect x="641" y="784" width="8" height="8" rx="2" fill="#A855F7"/>
<text class="s" x="661" y="796" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Docs alongside the code</tspan></text>
<text class="s" x="661" y="824" font-size="17" fill="#9DA7B3">So the next person — often future me — never has to</text>
<text class="s" x="661" y="851" font-size="17" fill="#9DA7B3">reverse-engineer it.</text>
<rect x="641" y="882" width="8" height="8" rx="2" fill="#A855F7"/>
<text class="s" x="661" y="894" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">Small, reversible changes</tspan></text>
<text class="s" x="661" y="922" font-size="17" fill="#9DA7B3">Boring solutions the whole team can maintain.</text>
<rect x="641" y="953" width="8" height="8" rx="2" fill="#A855F7"/>
<text class="s" x="661" y="965" font-size="19" fill="#F0F6FC"><tspan fill="#F0F6FC" font-weight="600">End-to-end ownership</tspan></text>
<text class="s" x="661" y="993" font-size="17" fill="#9DA7B3">Database → API → admin UI → deployment.</text>
<rect x="641" y="1052" width="67.2" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="657" cy="1068" r="5" fill="#F05032"/><text class="m" x="669" y="1072.9" font-size="14" fill="#C9D1D9">Git</text>
<rect x="716.2" y="1052" width="134.4" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="732.2" cy="1068" r="5" fill="#F0F6FC"/><text class="m" x="744.2" y="1072.9" font-size="14" fill="#C9D1D9">Code Review</text>
<rect x="858.6" y="1052" width="151.2" height="32" rx="16" fill="#151B23" stroke="#30363D"/><circle cx="874.6" cy="1068" r="5" fill="#8CA1AF"/><text class="m" x="886.6" y="1072.9" font-size="14" fill="#C9D1D9">Documentation</text>
<rect x="1" y="1136" width="1198" height="104" rx="14" fill="#0C1B2E" stroke="#1F6FEB" stroke-opacity="0.55"/>
<circle cx="45" cy="1188" r="15" fill="none" stroke="#58A6FF" stroke-width="1.8"/>
<text class="m" x="45" y="1194" font-size="17" fill="#58A6FF" font-weight="700" text-anchor="middle">i</text>
<text class="s" x="81" y="1182" font-size="19" fill="#9DA7B3">Most of my work lives in<tspan fill="#F0F6FC" font-weight="600"> private company repositories</tspan>, so this profile is a summary rather than a code archive.</text>
<text class="s" x="81" y="1212" font-size="19" fill="#9DA7B3">Happy to walk through the details in a conversation.</text>
