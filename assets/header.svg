<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Xuan Danh - Full-stack Developer, Backend and Automation">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
      .cursor { animation: blink 1.1s steps(1, end) infinite; }
      .led { animation: pulse 2s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>

    <clipPath id="frame"><rect width="1200" height="260" rx="14"/></clipPath>

    <!-- luoi nen, mo dan ve phia chu ben trai -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect y="40" width="1200" height="220" fill="url(#gridFade)"/></mask>

    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComponentTransfer in="blur" result="soft"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="#0D1117"/>
    <rect y="40" width="1200" height="220" fill="url(#grid)" mask="url(#gridMask)"/>
    <circle cx="990" cy="150" r="340" fill="url(#glowPurple)"/>
    <circle cx="80" cy="270" r="300" fill="url(#glowCyan)"/>

    <!-- thanh tieu de cua so terminal -->
    <rect width="1200" height="40" fill="#161B22"/>
    <path d="M0 40.5H1200" stroke="#30363D"/>
    <circle cx="26" cy="20" r="6.5" fill="#FF5F57"/>
    <circle cx="48" cy="20" r="6.5" fill="#FEBC2E"/>
    <circle cx="70" cy="20" r="6.5" fill="#28C840"/>
    <text x="600" y="25" text-anchor="middle" class="mono" font-size="14" fill="#8B949E">danh@hcmc: ~/github/Danh1910</text>
    <text x="1176" y="25" text-anchor="end" class="mono" font-size="13" fill="#6E7681">zsh</text>

    <!-- ben trai: prompt, ten, vai tro -->
    <text x="48" y="86" class="mono" font-size="18"><tspan fill="#3FB950">danh@hcmc</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#58A6FF">~</tspan><tspan fill="#8B949E">$ </tspan><tspan fill="#E6EDF3">whoami</tspan></text>

    <text x="48" y="148" class="mono" font-size="60" font-weight="700" fill="url(#nameFill)" filter="url(#glow)" textLength="324" lengthAdjust="spacing">Xuan Danh</text>
    <rect class="cursor" x="386" y="106" width="28" height="46" fill="#A855F7"/>

    <text x="48" y="190" class="mono" font-size="21"><tspan fill="#6E7681"># </tspan><tspan fill="#E6EDF3">Full-stack Developer</tspan><tspan fill="#6E7681"> · </tspan><tspan fill="#C084FC">Backend &amp; Automation</tspan></text>

    <text x="48" y="230" class="mono" font-size="15"><tspan fill="#A855F7">uptime:</tspan><tspan fill="#8B949E"> 1+ yr</tspan><tspan dx="24" fill="#A855F7">commits:</tspan><tspan fill="#8B949E"> 1,200+</tspan><tspan dx="24" fill="#A855F7">status:</tspan><tspan fill="#3FB950"> ● shipping</tspan></text>

    <!-- ben phai: pipeline webhooks / cron / extension -> api -> mysql -->
    <g fill="none" stroke="#30363D" stroke-width="2">
      <path id="p1" d="M832 90H850Q858 90 858 98V142Q858 150 866 150H884"/>
      <path id="p2" d="M832 150H884"/>
      <path id="p3" d="M832 210H850Q858 210 858 202V158Q858 150 866 150H884"/>
      <path id="p4" d="M994 150H1042"/>
    </g>

    <g class="mono" font-size="16" text-anchor="middle">
      <rect x="692" y="71" width="140" height="38" rx="8" fill="#161B22" stroke="#30363D"/>
      <text x="762" y="95" fill="#C9D1D9">webhooks</text>
      <rect x="692" y="131" width="140" height="38" rx="8" fill="#161B22" stroke="#30363D"/>
      <text x="762" y="155" fill="#C9D1D9">cron</text>
      <rect x="692" y="191" width="140" height="38" rx="8" fill="#161B22" stroke="#30363D"/>
      <text x="762" y="215" fill="#C9D1D9">extension</text>

      <rect x="884" y="131" width="110" height="38" rx="8" fill="#1C1530" stroke="#A855F7"/>
      <circle class="led" cx="904" cy="150" r="4" fill="#3FB950"/>
      <text x="944" y="155" fill="#E6EDF3">api</text>

      <rect x="1042" y="131" width="110" height="38" rx="8" fill="#0E1F26" stroke="#22D3EE"/>
      <text x="1097" y="155" fill="#E6EDF3">mysql</text>
    </g>

    <g filter="url(#dotGlow)">
      <circle r="3.5" fill="#22D3EE"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion></circle>
      <circle r="3.5" fill="#22D3EE"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite"><mpath xlink:href="#p2"/></animateMotion></circle>
      <circle r="3.5" fill="#22D3EE"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion></circle>
      <circle r="3.5" fill="#C084FC"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#p4"/></animateMotion></circle>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#30363D"/>
</svg>
